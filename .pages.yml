# =============================================================
#  Pages CMS 설정 — https://pagescms.org
#  app.pagescms.org 에서 GitHub 로그인 → 이 레포 선택만 하면
#  아래 정의대로 폼으로 공지를 작성할 수 있어요. (OAuth 앱/워커 불필요)
# =============================================================

media:
  input: public/uploads # 이미지 업로드 저장 폴더
  output: /uploads # 사이트에서 참조하는 경로

content:
  - name: notices
    label: 공지사항
    type: collection
    path: src/content/notices
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      fields: [category, title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title, summary]
    fields:
      - name: title
        label: 제목
        type: string
      - name: date
        label: 날짜
        type: date
        options:
          format: yyyy-MM-dd
      - name: category
        label: 카테고리
        type: select
        default: 안내
        options:
          values: [점검, 업데이트, 안내, 이벤트]
      - name: categoryLabel
        label: 상세 태그 라벨 (선택)
        type: string
        required: false
        description: 비우면 카테고리를 그대로 사용해요.
      - name: author
        label: 작성자
        type: string
        default: 운영팀
      - name: summary
        label: 요약 (상세 상단 인트로)
        type: text
        required: false
      - name: info
        label: 핵심정보 박스 (일시/영향/내용 등)
        type: object
        list: true
        required: false
        fields:
          - { name: label, label: 항목명, type: string }
          - { name: value, label: 내용, type: string }
      - name: tags
        label: 해시태그
        type: string
        list: true
        required: false
      - name: pinned
        label: 상단 고정
        type: boolean
        default: false
      - name: body
        label: 본문
        type: rich-text
